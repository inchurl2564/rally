name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Docs
        run: |
          curl -sL https://currentsapi.services/en/docs/search | python3 -c "import sys,re,html;t=sys.stdin.read();t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=html.unescape(re.sub(r'<[^>]+>',' ',t));print(re.sub(r'\s+',' ',t)[:9000])"
      - name: Try variants
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          K = os.environ["CURRENTS_API_KEY"]
          base = {"language": "en", "page_size": 20, "start_date": "2026-11-11T00:00:00+00:00", "end_date": "2026-11-17T23:59:59+00:00"}
          for extra in [{"keywords": "The Nightingale"}, {"keywords": "Nightingale trailer"}, {"keywords": '"The Nightingale" Fanning'},
                        {"keywords": "Nightingale", "category": "entertainment"}, {"keywords": "Nightingale Fanning"}]:
              q = urllib.parse.urlencode({**base, **extra})
              try:
                  d = json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.currentsapi.services/v1/search?{q}", headers={"Authorization": K, "User-Agent": "Rallyback/1.0"}), timeout=30))
                  ts = [a.get("title", "")[:70] for a in d.get("news", [])]
                  print(extra, len(ts), sum("ightingale" in t for t in ts)); [print("    ", t) for t in ts[:6]]
              except urllib.error.HTTPError as e:
                  print(extra, "HTTP", e.code, e.read()[:200])
          PY
