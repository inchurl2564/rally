name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Billed stars
        run: |
          python3 -c "
          import radar
          qs = {'Q736788': 'Planes, Trains and Automobiles', 'Q740489': 'Meet the Fockers', 'Q164103': 'A Beautiful Mind', 'Q244604': 'Minority Report', 'Q655996': 'The Devils', 'Q623724': 'Meet the Parents'}
          got = radar.fetch_star_images(set(qs))
          for q, n in qs.items(): print('STAR', n, '->', got.get(q))
          "
