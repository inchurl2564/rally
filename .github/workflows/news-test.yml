name: News feeds test (one-off)
# Reads every news feed from GitHub's servers and searches for some current comebacks.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python newsfeeds.py --test "Minority Report|film" "Lost in Translation|film" "Heist|film" "4.50 from Paddington|book" "Something About Amelia|film" "Say You, Say Me|song" "@Marina Sirtis"
