name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PTA picture 2
        run: |
          python3 -c "
          import radar
          print('star', radar.fetch_people_images({'Q736788'}, props_order=radar.SCREEN_IMAGE_PROPS))
          r = radar.sparql('SELECT ?pLabel ?links ?img WHERE { wd:Q736788 wdt:P161 ?p . ?p wikibase:sitelinks ?links . OPTIONAL { ?p wdt:P18 ?img } SERVICE wikibase:label { bd:serviceParam wikibase:language \"en\". } } ORDER BY DESC(?links) LIMIT 6')
          for x in r: print('cast', radar.v(x,'pLabel'), radar.v(x,'links'), (radar.v(x,'img') or '')[-60:])
          "
