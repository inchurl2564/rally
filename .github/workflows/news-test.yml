name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          UA = {"User-Agent": "Rallyback/1.0 (+https://therallyback.com/?tab=about)", "Accept": "application/sparql-results+json"}
          def q(s):
              u = "https://query.wikidata.org/sparql?" + urllib.parse.urlencode({"query": s})
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60))["results"]["bindings"]
          for name in ["National Film Registry", "National Recording Registry", "Grammy Hall of Fame", "Rock and Roll Hall of Fame"]:
              rows = q(f'SELECT ?x WHERE {{ ?x rdfs:label "{name}"@en }} LIMIT 5')
              print(name, [r["x"]["value"].rsplit("/",1)[1] for r in rows])
              for r in rows:
                  x = r["x"]["value"].rsplit("/",1)[1]
                  for p in ["P166", "P1435", "P463", "P31", "P361"]:
                      c = q(f"SELECT (COUNT(*) AS ?n) WHERE {{ ?i wdt:{p} wd:{x} }}")[0]["n"]["value"]
                      if c != "0":
                          d = q(f"""SELECT ?i ?iLabel ?d ?pq WHERE {{ ?i p:{p} ?s . ?s ps:{p} wd:{x} . OPTIONAL {{ ?s ?pq ?d . FILTER(?pq IN (pq:P585, pq:P580)) }}
                                 SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en". }} }} ORDER BY DESC(?d) LIMIT 5""")
                          print(f"   {x} {p}: {c} items; latest:", [(r["iLabel"]["value"], r.get("d", {}).get("value", "")[:10], r.get("pq", {}).get("value", "")[-5:]) for r in d])
          k = os.environ.get("YOUTUBE_API_KEY")
          for region, cat in [("US", "10"), ("US", "1"), ("US", "24"), ("GB", "10")]:
              u = "https://www.googleapis.com/youtube/v3/videos?" + urllib.parse.urlencode({"part": "snippet,statistics", "chart": "mostPopular", "regionCode": region, "videoCategoryId": cat, "maxResults": 50, "key": k})
              try:
                  d = json.load(urllib.request.urlopen(u, timeout=30))
                  items = d.get("items", [])
                  print(f"\nYT {region} cat {cat}: {len(items)}")
                  for it in items[:8]:
                      print("   ", it["snippet"]["publishedAt"][:10], it["snippet"]["title"][:90], it["statistics"].get("viewCount"))
              except Exception as e:
                  print("YT error", region, cat, e)
          PY
