name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Star pictures
        run: |
          python3 -c "
          import radar
          qs = {'Q740489': 'Meet the Fockers', 'Q164103': 'A Beautiful Mind', 'Q244604': 'Minority Report', 'Q623724': 'Meet the Parents', 'Q655996': 'The Devils'}
          got = radar.fetch_people_images(set(qs), props_order=radar.SCREEN_IMAGE_PROPS)
          for q, n in qs.items(): print(n, '->', got.get(q))
          "
