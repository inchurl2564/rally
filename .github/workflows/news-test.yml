name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Currents on unexplained comebacks
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, glob, datetime as dt
          import currents
          f = sorted(glob.glob('site/data/runs/*.json'))[-1]
          today = dt.date.today()
          rs = [r for r in json.load(open(f))['results'] if r['verdict'] in ('unexplained', 'weak link')
                and dt.date.fromisoformat(r['spike_start']) >= today - dt.timedelta(days=24)]
          rs.sort(key=lambda r: -(r.get('score_hint') or 0))
          tests = [("The Nightingale", "2026-11-16", False, "book")] + [(r.get('label') or r['title'], r['spike_start'], False, r.get('kind')) for r in rs[:24]]
          for t, day, person, kind in tests:
              hits = currents.search(t, dt.date.fromisoformat(day), person=person, kind=kind)
              if hits:
                  print(f"== {t} ({kind}, {day}): {len(hits)}")
                  for e in hits: print("    ", e["published"], e["source"], "|", e.get("cause"), "|", e["url"][:110])
          print(currents.summary())
          PY
