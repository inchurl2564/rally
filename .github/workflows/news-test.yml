name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Raw
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          K = os.environ["CURRENTS_API_KEY"]
          for qq, a, b in [('"Russell Brand"', "2026-11-06", "2026-11-12"), ('"The Nightingale"', "2026-11-11", "2026-11-17")]:
              q = urllib.parse.urlencode({"query": qq, "language": "en", "page_size": 20, "start_date": f"{a}T00:00:00+00:00", "end_date": f"{b}T23:59:59+00:00"})
              try:
                  d = json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.currentsapi.services/v1/search?{q}", headers={"Authorization": K, "User-Agent": "Rallyback/1.0"}), timeout=30))
                  ts = d.get("news", [])
                  print(qq, d.get("status"), len(ts)); [print("    ", x.get("published", "")[:10], x.get("url", "")[:60], "|", x.get("title", "")[:80]) for x in ts[:8]]
              except urllib.error.HTTPError as e:
                  print(qq, "HTTP", e.code, e.read()[:300])
          PY
