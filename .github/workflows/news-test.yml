name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Probe Discogs dumps
        run: |
          curl -s "https://discogs-data-dumps.s3.us-west-2.amazonaws.com/?prefix=data/2026/&list-type=2" | tr '<' '\n' | grep -E "^(Key|Size)>" | tail -40
          curl -sI "https://data.discogs.com/" | head -5
          URL=$(curl -s "https://discogs-data-dumps.s3.us-west-2.amazonaws.com/?prefix=data/2026/&list-type=2" | tr '<' '\n' | grep "^Key>" | sed 's/Key>//' | grep releases.xml.gz | tail -1)
          echo "URL: $URL"
          curl -s "https://discogs-data-dumps.s3.us-west-2.amazonaws.com/$URL" | head -c 30000000 | gzip -dc 2>/dev/null | head -c 6000; echo
          echo "-----lines"
          curl -s "https://discogs-data-dumps.s3.us-west-2.amazonaws.com/$URL" | head -c 30000000 | gzip -dc 2>/dev/null | awk '{print length($0)}' | head -20
          echo "-----reissue sample"
          curl -s "https://discogs-data-dumps.s3.us-west-2.amazonaws.com/$URL" | head -c 60000000 | gzip -dc 2>/dev/null | grep -m3 "Reissue" | cut -c1-3000
          echo "-----speed"
          time (curl -s "https://discogs-data-dumps.s3.us-west-2.amazonaws.com/$URL" | head -c 1000000000 | gzip -dc 2>/dev/null | wc -lc)
