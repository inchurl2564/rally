name: news-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PTA picture
        run: |
          python3 -c "
          import radar
          r = radar.sparql('SELECT ?item WHERE { ?item rdfs:label \"Planes, Trains and Automobiles\"@en ; wdt:P31 wd:Q11424 }')
          qs = {radar.qid(radar.v(x, 'item')) for x in r}
          print('qids', qs)
          print('star', radar.fetch_people_images(qs, props_order=radar.SCREEN_IMAGE_PROPS))
          print('own', radar.fetch_images(qs))
          "
