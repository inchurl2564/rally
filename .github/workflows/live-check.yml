name: live-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 30); do
            j=$(curl -s "https://therallyback.com/data/runs/2026-11-26.json?n=$i$RANDOM")
            if echo "$j" | grep -q "andy-taylor-death-2026" && echo "$j" | grep -q "rings-of-power-s3-2026"; then echo "LIVE at $(date -u +%H:%M:%S) (try $i)"; break; fi
            echo "try $i: not yet"; sleep 20; done
          curl -s https://therallyback.com/data/runs/2026-11-26.json | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          print('Duran titles with the note:', sum(1 for r in d['results'] if (r.get('editor_note') or {}).get('id')=='andy-taylor-death-2026'))
          print('Tolkien books with the note:', [r['label'] for r in d['results'] if (r.get('editor_note') or {}).get('id')=='rings-of-power-s3-2026'])
          print('Thurston / Tolkien groups explained:', [(t['name'], bool(t.get('editor_note'))) for t in d['common_threads'] if t['name'] in ('Colin Thurston','J. R. R. Tolkien')])"
