name: live-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 20); do
            if curl -s "https://therallyback.com/?n=$i$RANDOM" | grep -q "Castle Bridge Media"; then echo "LIVE on try $i"; break; fi
            echo "try $i: not yet"; sleep 30; done
          curl -s https://therallyback.com/ | grep -o "©[^<]*<span[^>]*>[0-9]*</span>[^<]*"
