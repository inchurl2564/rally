name: live-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 30); do
            if curl -s "https://therallyback.com/data/runs/2026-11-26.json?n=$i$RANDOM" | grep -q "the-body-netflix-name-2026"; then echo "LIVE at $(date -u +%H:%M:%S) (try $i)"; break; fi
            echo "try $i: not yet"; sleep 20; done
          curl -s https://therallyback.com/w/Q1120143 | grep -o "Netflix[^<]\{0,50\}" | head -1
