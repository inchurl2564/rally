name: live-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q beautifulsoup4
          python3 - <<'PY'
          import urllib.request, re
          from bs4 import BeautifulSoup
          seen, todo = set(), ["https://www.castlebridgemedia.com/"]
          while todo and len(seen) < 6:
              u = todo.pop(0)
              if u in seen: continue
              seen.add(u)
              try:
                  html = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (compatible; site-check)"}), timeout=30).read().decode("utf-8", "replace")
              except Exception as e:
                  print("=====", u, "FAILED", e); continue
              s = BeautifulSoup(html, "html.parser")
              for t in s(["script", "style", "noscript"]): t.decompose()
              print("=====", u, "| title:", s.title.string if s.title else "")
              m = s.find("meta", attrs={"name": "description"}); print("description:", m["content"] if m else "")
              print(re.sub(r"\n\s*\n+", "\n", s.get_text("\n")).strip()[:3000])
              for a in s.find_all("a", href=True):
                  h = a["href"]
                  if h.startswith("/") and not h.startswith("//"): h = "https://www.castlebridgemedia.com" + h
                  if "castlebridgemedia.com" in h and "#" not in h and h not in seen: todo.append(h.split("?")[0])
          PY
