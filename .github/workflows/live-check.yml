name: live-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 30); do
            p=$(curl -s -o /dev/null -w "%{http_code}" "https://therallyback.com/privacy?n=$i$RANDOM")
            t=$(curl -s "https://therallyback.com/privacy?n=$i$RANDOM" | grep -c "Global Privacy" || true)
            h=$(curl -s "https://therallyback.com/?n=$i$RANDOM" | grep -c 'href="privacy"' || true)
            w=$(curl -s "https://therallyback.com/w/Q2478017?n=$i$RANDOM" | grep -c '/privacy">Privacy' || true)
            if [ "$p" = 200 ] && [ "$t" -gt 0 ] && [ "$h" -gt 0 ] && [ "$w" -gt 0 ]; then echo "LIVE at $(date -u +%H:%M:%S): page, homepage link, title-page link (try $i)"; break; fi
            echo "try $i: page $p/$t, home link $h, title link $w"; sleep 20; done
