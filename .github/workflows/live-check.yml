name: live-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 20); do
            curl -s https://therallyback.com/app.js | grep -q WORK_SHARDS && break; echo "waiting for deploy"; sleep 30; done
          curl -s https://therallyback.com/app.js | grep -c WORK_SHARDS
          for q in Q102225 Q632680 Q591272; do
            n=$(( ${q#Q} % 256 ))
            printf "%s in bundle %s: " $q $n; curl -s https://therallyback.com/data/works/$n.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['$q']['label'])"
            printf "  title page /w/%s: " $q; curl -s -o /dev/null -w "%{http_code}\n" -L https://therallyback.com/w/$q
          done
          printf "home: "; curl -s -o /dev/null -w "%{http_code}\n" https://therallyback.com/
          printf "index.json titles: "; curl -s https://therallyback.com/data/works/index.json | python3 -c "import json,sys; print(len(json.load(sys.stdin)['works']))"
