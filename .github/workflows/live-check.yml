name: live-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          curl -s "https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=OqUvNq6JhZM&key=$K" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          for v in d.get('items',[]):
              s=v['snippet']; print('TITLE:', s['title']); print('CHANNEL:', s['channelTitle']); print('PUBLISHED:', s['publishedAt']); print('VIEWS:', v['statistics'].get('viewCount'))
              print('DESC:', s['description'][:600].replace(chr(10),' / '))
          print('items:', len(d.get('items',[])), d.get('error',{}).get('message',''))"
