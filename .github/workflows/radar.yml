name: Update Revival Radar

on:
  schedule:
    - cron: "23 4 * * *"   # daily, after Wikimedia publishes the previous day's pageviews
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    # Redeploy committed data when code changes (doesn't rerun the radar).
    paths: ["site/**", "radar.py", ".github/workflows/**", "!site/data/**"]

permissions:
  contents: write   # commit each day's results to site/data
  pages: write
  id-token: write

concurrency:
  group: revival-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pageview history and API responses. Daily runs only fetch new days, so they're much faster.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-

      - name: Run the radar
        if: github.event_name != 'push'
        env:
          RADAR_CONTACT: https://github.com/${{ github.repository }}
        run: python radar.py --site site

      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: run for $(date -u -d yesterday +%F)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
