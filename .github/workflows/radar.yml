name: Update The Rallyback

on:
  schedule:
    # Daily at 2 a.m. Pacific. GitHub schedules run on UTC, and 2 a.m. Pacific is 09:00 UTC
    # in daylight saving time and 10:00 UTC otherwise, so both are scheduled and the gate
    # job below lets only the one that lands at 2 a.m. in Los Angeles do the work.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    # Redeploy committed data when code changes (doesn't rerun the radar).
    paths: ["site/**", "*.py", "annotations.json", ".github/pages-pointer/**", "wrangler.jsonc", ".github/workflows/radar.yml", "!site/data/**", "!site/feeds/**", "!site/w/**"]

permissions:
  contents: write   # commit each day's results
  issues: write     # post the daily digest; read reader reports
  pages: write
  id-token: write

concurrency:
  group: revival-radar
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # Decide by which schedule fired, not the clock, so a delayed start can't run twice.
        run: |
          offset=$(TZ=America/Los_Angeles date +%z)          # -0700 in daylight time, -0800 otherwise
          want=$([ "$offset" = "-0700" ] && echo "0 9 * * *" || echo "0 10 * * *")
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This schedule isn't 2 a.m. Pacific today (Los Angeles is at UTC$offset); the other one runs."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180    # the very first run downloads ~4 weeks of bulk files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pageview history, bulk-file extracts, the watchlist and API responses.
      # Daily runs only fetch what's new, so they take minutes, not hours.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-

      - name: Tally reader reports
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n() { gh issue list --repo "$GITHUB_REPOSITORY" --state all --label "$1" --limit 1000 --json number --jq length 2>/dev/null || echo 0; }
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label feedback --limit 1000 --json number --jq length 2>/dev/null || echo 0)
          mkdir -p site/data
          echo "{\"correct\": $(n verified-correct), \"wrong\": $(n verified-wrong), \"open\": $open}" > site/data/feedback.json
          cat site/data/feedback.json

      - name: Corroborate draft editor's notes
        if: github.event_name != 'push'
        run: python annotations.py --check || true

      - name: Run the radar
        if: github.event_name != 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}     # optional: YouTube lookups for unexplained comebacks
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}   # optional: Currents News API (free plan)
          BLUESKY_HANDLE: therallyback.bsky.social                # Bluesky search signs in as this account
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUEVIOLET }}      # the app password, saved as BLUEVIOLET
        run: python radar.py --site site

      # Before saving: is tonight's edition complete? If not, stop here. Nothing is saved or published,
      # yesterday's edition stays up, and one "needs attention" issue (an email) says what was wrong.
      - name: Check the edition before publishing
        id: check
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python health.py --site site --gate > gate.md; then echo "Edition looks complete."; exit 0; fi
          cat gate.md
          gh label create health --color d93f0b --description "The Rallyback needs attention" 2>/dev/null || true
          gh issue create --title "The Rallyback: tonight's edition was held back" --label health \
            --body "$(printf 'The nightly run finished, but its edition failed the completeness check, so it was not published and yesterday'"'"'s edition is still up:\n\n'; cat gate.md; printf '\nDetails: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          exit 1

      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/feeds site/w site/week site/report site/index.html site/sitemap.xml site/robots.txt store annotations.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: run for $(date -u -d yesterday +%F)"
            git pull --rebase origin main
            git push
          fi

      # Tell Bing and other IndexNow engines which pages tonight's edition added or changed,
      # once Cloudflare has published them (it deploys a few minutes after the push).
      - name: Ping search engines (IndexNow)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if git log -1 --format=%s | grep -q "^data: run for"; then sleep 240; python tools/indexnow.py; else echo "No new edition."; fi

      # The day's story on Bluesky (approved by the owner Nov 24; set BLUESKY_POST to "off" to pause).
      # What was posted is recorded in site/data/social.json.
      - name: Post to Bluesky
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BLUESKY_POST: "on"
          BLUESKY_HANDLE: therallyback.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUEVIOLET }}
        run: |
          python bluesky_post.py
          if ! git diff --quiet -- site/data/social.json 2>/dev/null || [ -n "$(git status --porcelain site/data/social.json)" ]; then
            git add site/data/social.json && git commit -m "social: Bluesky post $(date -u +%F)" && git pull --rebase origin main && git push
          fi

      # Health check: opens (or adds to) one "needs attention" issue, which emails the repo owner,
      # only when something needs a person. Quiet nights send nothing.
      - name: Health check
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python health.py --site site > health.md || true
          if [ -s health.md ]; then
            gh label create health --color d93f0b --description "The Rallyback needs attention" 2>/dev/null || true
            body="$(printf 'Nightly check, %s:\n\n' "$(date -u +%F)"; cat health.md; printf '\nClose this issue once it is dealt with.\n')"
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label health --state open --json number --jq '.[0].number' 2>/dev/null)
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "The Rallyback needs attention" --label health --body "$body"; fi
          else
            echo "All quiet."
          fi

      # If any step above failed, say so in an issue (an email) with a link to the run.
      - name: Report a failed run
        if: failure() && github.event_name != 'push' && steps.check.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create health --color d93f0b --description "The Rallyback needs attention" 2>/dev/null || true
          gh issue create --title "The Rallyback: last night's update failed" --label health \
            --body "The nightly run failed on $(date -u +%F), so today's edition may be missing or old. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Anyone watching the repo (Watch → Custom → Issues) gets this by email.
      # Email digest is paused (feeds only for now). To resume: Settings → Secrets and
      # variables → Actions → Variables → add EMAIL_DIGEST = true.
      - name: Post daily digest
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.EMAIL_DIGEST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s site/data/digest.md ] || exit 0
          grep -q "0 new findings" site/data/digest.md && { echo "Nothing new today."; exit 0; }
          gh label create digest --color 2d5bd7 --description "Daily Rallyback digest" 2>/dev/null || true
          gh label create feedback --color b4462c --description "Reader correction" 2>/dev/null || true
          gh label create verified-correct --color 2d6f4f 2>/dev/null || true
          gh label create verified-wrong --color 8a877f 2>/dev/null || true
          for n in $(gh issue list --label digest --state open --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed >/dev/null
          done
          gh issue create --title "The Rallyback: the comeback report, $(date -u -d yesterday '+%b %-d, %Y')" \
            --label digest --body-file site/data/digest.md

      # Stamp the script and stylesheet with this commit, so a browser never pairs a cached
      # old app.js with a new page (GitHub Pages lets browsers cache files for 10 minutes).
      - name: Version the script and stylesheet
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|; s|href=\"style.css\"|href=\"style.css?v=$v\"|" site/index.html
          grep -n "app.js\|style.css" site/index.html

      # The site itself is published by Cloudflare at therallyback.com (from this repo).
      # The old GitHub Pages address now only forwards visitors there, and keeps serving the
      # feeds so existing subscriptions don't break.
      - name: Build the GitHub Pages pointer
        run: |
          rm -rf .github/pages-pointer/feeds && cp -r site/feeds .github/pages-pointer/feeds

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-pointer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
