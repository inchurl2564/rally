name: Check editor's notes

# Tries to corroborate draft notes in annotations.json from open sources
# (Wikipedia's cited text, Current events, GDELT) and publishes any it can source.
# Also runs as part of the daily update.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python annotations.py --check
      - name: Commit any newly sourced notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add annotations.json
          git diff --cached --quiet || { git commit -m "notes: corroborated from open sources"; git pull --rebase origin main; git push; }
