<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rallyback: today's top comebacks</title>
<style>
  :root { --paper: #faf8f4; --ink: #1b1a1f; --muted: #6b6760; --hair: #e5e0d6; --red: #c2401e; --score: #f5c518; }
  @media (prefers-color-scheme: dark) { :root { --paper: #141317; --ink: #efece6; --muted: #a29d96; --hair: #2e2c32; --red: #ff7a52; --score: #f0bf2a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .box { padding: 14px 16px; }
  h1 { font: 900 20px/1.1 Georgia, serif; margin: 0 0 2px; }
  h1 a { color: inherit; text-decoration: none; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--hair); }
  .n { font: 900 18px Georgia, serif; color: var(--red); }
  .t a { color: inherit; font-weight: 700; text-decoration: none; }
  .s { color: var(--muted); font-size: 12px; }
  .dot { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; background: var(--score); color: #1b1a1f; font-weight: 800; font-size: 11.5px; }
  .credit { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .credit a { color: var(--red); }
</style>
</head>
<body>
<div class="box">
  <h1><a href="./" target="_top">The Rallyback</a></h1>
  <p class="sub" id="sub">Today's top comebacks</p>
  <ol id="list"></ol>
  <p class="credit">Updated every morning by <a href="./" target="_top">The Rallyback</a>, from open data. The yellow circle is the Rallyback Score (0–100).</p>
</div>
<script>
(async () => {
  const n = Math.min(Math.max(parseInt(new URLSearchParams(location.search).get("n")) || 10, 3), 25);
  const d = await (await fetch("data/latest.json", { cache: "no-cache" })).json();
  const skip = new Set(["seasonal", "automated?", "front page"]);
  const seen = new Set(), rows = [];
  // One per story: titles sharing a trigger (a new release, a death) are shown once.
  for (const r of d.results.filter((r) => !skip.has(r.verdict)).sort((a, b) => b.score - a.score)) {
    const t = (r.triggers || [])[0], key = t && t.qid && t.type !== "anniversary" ? t.qid : r.qid;
    if (seen.has(key)) continue;
    seen.add(key); rows.push(r);
    if (rows.length === n) break;
  }
  const x = (v) => `${v >= 10 ? Math.round(v) : v}×`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("sub").textContent = `Today's top comebacks · ${new Date(d.meta.window_end + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}`;
  document.getElementById("list").innerHTML = rows.map((r, i) => `<li><span class="n">${i + 1}</span>
    <span class="t"><a href="./?work=${esc(r.qid)}" target="_top">${esc(r.label)}</a><br><span class="s">${esc(r.kind)}, ${r.release_year} · ${x(Math.max(r.lift, r.lift3 || 0))} usual interest</span></span>
    ${r.rally_score != null ? `<span class="dot" title="Rallyback Score">${r.rally_score}</span>` : ""}</li>`).join("");
})();
</script>
</body>
</html>
