<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revival Radar</title>
  <meta name="description" content="Older films, songs, games and books that are suddenly getting attention again, why, and what's likely next. Rebuilt daily from open Wikipedia and Wikidata data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232d5bd7' stroke-width='3'/%3E%3Cpath d='M4 20 L11 20 L14 9 L18 25 L21 16 L28 16' fill='none' stroke='%232d5bd7' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="alternate" type="application/atom+xml" title="Revival Radar: all new findings" href="feeds/all.xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <h1><a href="./">Revival Radar</a></h1>
        <p class="tag">Old films, songs, games and books suddenly back in the spotlight: why, and what's next.</p>
      </div>
      <label class="run-pick">
        <span>Daily run</span>
        <select id="run" aria-label="Choose a daily run"></select>
      </label>
    </div>
    <nav class="wrap tabs" id="tabs" aria-label="Views"></nav>
  </header>

  <main class="wrap" id="view">
    <p id="status" class="status" role="status">Loading…</p>
  </main>

  <footer class="wrap foot">
    Data: <a href="https://dumps.wikimedia.org/other/pageview_complete/readme.html">Wikimedia pageviews</a> (human traffic),
    <a href="https://www.wikidata.org/">Wikidata</a> (CC0), Wikipedia edit history, and
    <a href="https://www.gdeltproject.org/">GDELT</a> news. Findings are leads, not conclusions.
    <span id="generated"></span>
  </footer>

  <div id="tip" class="tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
